<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Austral monitor</title>
  <style>
    @font-face { font-family: Manrope; src: url('/manrope.woff2') format('woff2'); font-weight: 400 800; font-display: swap; }
    :root {
      color-scheme: light;
      --ink: #163f35; --paper: #f5f8f3; --muted: #4f685e; --accent: #d7f39b; --line: #cedbd0;
      --chat: #edf3e8; --focus: #668f31; --card: #ffffff; --warn: #9a3b1d; --on-warn: #ffffff;
      --on-accent: #163f35; --brand-dot: #67923b;
      --product: #163f35; --air: #668f31; --ambient: #4f685e; --door: #163f35;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #e8f2ea; --paper: #0f241e; --muted: #a9c2b4; --accent: #d7f39b; --line: #2a4a40;
        --chat: #17332b; --focus: #a6d35f; --card: #14302a; --warn: #e58a67; --on-warn: #1b0d07;
        --on-accent: #163f35; --brand-dot: #a6d35f;
        --product: #d7f39b; --air: #7fb7e8; --ambient: #e0b36a; --door: #d7f39b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 Manrope, sans-serif; font-synthesis: none; }
    main { width: min(1100px, calc(100% - 48px)); margin: 0 auto 48px; display: grid;
      grid-template-columns: minmax(0, 1fr); gap: 16px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    ::selection { background: var(--accent); color: var(--on-accent); }
    header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding: 28px 0 8px; }
    .brand { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
    .brand span { color: var(--brand-dot); }
    .brand small { font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--muted); margin-left: 6px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
    select { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 50px; padding: 8px 14px; max-width: 100%; }
    .pill { display: inline-block; border-radius: 50px; padding: 2px 12px; font-size: 13px; font-weight: 700;
      background: var(--accent); color: var(--on-accent); }
    .pill.off { background: var(--warn); color: var(--on-warn); }
    .pill.idle { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .conn.on i { background: var(--focus); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px 24px; min-width: 0; }
    h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .tile { background: var(--chat); border-radius: 18px; padding: 14px 16px; min-width: 0; }
    .tile span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    .tile strong { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere; line-height: 1.3; }
    .tile strong small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 3px; }
    .tile.alert strong { color: var(--warn); }
    .tile em { display: block; font-size: 12px; font-style: normal; color: var(--muted); }
    .ranges { display: flex; gap: 6px; }
    .ranges button { font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); background: transparent;
      border: 1px solid var(--line); border-radius: 50px; padding: 5px 14px; cursor: pointer; }
    .ranges button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    canvas { width: 100%; height: 300px; display: block; }
    canvas.small { height: 160px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; margin-right: 8px; vertical-align: middle; }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      main { width: calc(100% - 32px); }
      header { padding-top: 20px; }
      .panel { padding: 16px; border-radius: 20px; }
      canvas { height: 230px; }
      canvas.small { height: 140px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile strong { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand">austral<span>.</span><small>monitor</small></h1>
      <div class="meta">
        <select id="device" aria-label="Dispositivo" hidden></select>
        <span class="pill idle" id="status">sem dados</span>
        <span id="seen"></span>
        <span class="conn" id="conn"><i></i><b id="conn-text">conectando</b></span>
      </div>
    </header>
    <p class="empty panel" id="empty" hidden>Nenhum dispositivo enviou dados ainda.</p>
    <section class="panel" id="tiles-panel" hidden>
      <div class="tiles" id="tiles" aria-live="polite"></div>
    </section>
    <section class="panel" id="temp-panel" hidden>
      <div class="head">
        <h2>Temperaturas</h2>
        <div class="ranges" id="ranges" role="group" aria-label="Período"></div>
      </div>
      <canvas id="temp-chart" role="img" aria-label="Temperatura do produto, do ar e do ambiente ao longo do tempo"></canvas>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel" id="door-panel" hidden>
      <div class="head"><h2>Porta</h2></div>
      <canvas id="door-chart" class="small" role="img" aria-label="Distância do sensor da porta ao longo do tempo"></canvas>
    </section>
  </main>
  <script type="module" src="/monitor.js"></script>
</body>
</html>

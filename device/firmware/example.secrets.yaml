wifi_ssid: "YOUR_2_4_GHZ_NETWORK"
wifi_password: "YOUR_WIFI_PASSWORD"
fallback_password: "fallback-access-point-password"
ota_password: "ota-password"
# https URL of POST /ingest, or http on a local network.
ingest_url: "https://ingest.example.com/ingest"
# Must match this device in AUSTRAL_DEVICE_TOKENS on the server.
ingest_token: "YOUR_DEVICE_TOKEN"
# ROM code of the air probe as ESPHome prints it on the first boot ("Found 1-Wire devices").
air_sensor_address: "0x0000000000000028"

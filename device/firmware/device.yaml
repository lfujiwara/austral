substitutions:
  device_name: austral-device
  # Meters above the closed-door baseline before the door counts as open.
  door_margin: "0.05"
  # Offline variant. Set this to packages/buzzer.yaml to enable the audible alarm.
  buzzer_package: packages/buzzer_off.yaml
  # Offline variant. Set this to packages/display.yaml to enable the OLED.
  display_package: packages/display_off.yaml
  default_broker: !secret mqtt_broker

packages:
  buzzer: !include ${buzzer_package}
  display: !include ${display_package}

esphome:
  name: ${device_name}
  friendly_name: Austral Device
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(air_temperature)->stop_poller();
          id(air_temperature)->set_update_interval((uint32_t) id(read_interval).state * 1000);
          id(air_temperature)->start_poller();
          if (id(mqtt_broker).state.size() >= 3 && id(mqtt_broker).state != "${default_broker}") {
            id(mqtt_client)->set_broker_address(id(mqtt_broker).state);
            id(mqtt_client)->disable();
            id(mqtt_client)->enable();
          }
      # Setup runs before the web server accepts /events. Repeat the search result once the device is on the network.
      - delay: 10s
      - lambda: id(air_temperature)->log_search_result();

esp32:
  board: esp32dev

# Local copy of the ESPHome dallas_temp component. It differs from upstream in two places: the scratch pad
# bytes of a failed checksum are logged at WARN instead of DEBUG, and setup logs the ROM found by the
# One-Wire search (or that none was found) at WARN/INFO so it appears at the INFO log level. See
# components/dallas_temp/dallas_temp.cpp.
external_components:
  - source:
      type: local
      path: components
    components: [dallas_temp]

logger:
  level: INFO
  logs:
    # A missing echo is expected and published as nan. Do not log it ten times a second.
    ultrasonic.sensor: ERROR

wifi:
  id: wifi_client
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Lower peak transmit current for boards with a weak 3.3 V regulator.
  output_power: 8.5dB
  ap:
    ssid: "Austral-Device-Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: sntp_time

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  certificate_authority: !secret mqtt_ca
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: austral/${device_name}
  discovery: false

one_wire:
  - platform: gpio
    pin: GPIO4
    id: one_wire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: one_wire_bus
    # First device found by the GPIO4 One-Wire ROM search at setup. No stored ROM address.
    index: 0
    name: "Air temperature"
    id: air_temperature
    resolution: 12
    update_interval: 10s

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  # HC-SR04: Trig on GPIO26, Echo on GPIO27 through a 1k/2k divider.
  # Raw reads every 100 ms feed the calibration. Published once a second as the median of those 10 reads.
  - platform: ultrasonic
    trigger_pin: GPIO26
    echo_pin: GPIO27
    name: "Door distance"
    id: door_distance
    update_interval: 100ms
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 10
          send_every: 10
    on_raw_value:
      - lambda: |-
          if (id(calibrating) && !std::isnan(x) && x > 0) id(calibration_samples).push_back(x);

globals:
  - id: calibrating
    type: bool
    initial_value: "false"
  - id: calibration_samples
    type: std::vector<float>

script:
  - id: calibrate_door
    mode: single
    then:
      - lambda: |-
          id(calibration_samples).clear();
          id(calibrating) = true;
      - delay: 3s
      - lambda: |-
          id(calibrating) = false;
          auto &samples = id(calibration_samples);
          if (samples.size() < 5) {
            ESP_LOGW("calibrate", "Door calibration failed: %u valid samples, need 5. Baseline unchanged.", (unsigned) samples.size());
            return;
          }
          std::sort(samples.begin(), samples.end());
          float median = samples.size() % 2 ? samples[samples.size() / 2] : (samples[samples.size() / 2 - 1] + samples[samples.size() / 2]) / 2;
          ESP_LOGI("calibrate", "Door closed distance %.3f m from %u samples", median, (unsigned) samples.size());
          id(door_closed_distance).make_call().set_value(median).perform();
          samples.clear();

button:
  - platform: template
    name: "Calibrate door"
    id: calibrate_door_button
    on_press:
      - script.execute: calibrate_door

text:
  - platform: template
    name: "MQTT broker"
    id: mqtt_broker
    mode: text
    optimistic: true
    min_length: 3
    max_length: 64
    initial_value: !secret mqtt_broker
    restore_value: true
    set_action:
      - lambda: |-
          id(mqtt_client)->set_broker_address(x);
          id(mqtt_client)->disable();
          id(mqtt_client)->enable();

number:
  - platform: template
    name: "Read interval"
    id: read_interval
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 10
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(air_temperature)->stop_poller();
          id(air_temperature)->set_update_interval((uint32_t) x * 1000);
          id(air_temperature)->start_poller();

  - platform: template
    name: "Door closed distance"
    id: door_closed_distance
    unit_of_measurement: m
    min_value: 0
    max_value: 4
    step: 0.001
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true

  - platform: template
    name: "Alarm threshold"
    id: alarm_threshold
    unit_of_measurement: "°C"
    min_value: -40
    max_value: 40
    step: 0.1
    mode: box
    initial_value: 5.0
    restore_value: true
    optimistic: true

binary_sensor:
  # MC-38 reed, normally open, one wire on GPIO33 and the other on GND.
  # Internal pull-up: contact closed (magnet near) pulls the pin low and the door is shut.
  # Contact open leaves the pin high and the door is open. device_class door uses ON for open.
  - platform: gpio
    name: "Door contact"
    id: door_contact
    device_class: door
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: false
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  - platform: template
    name: "Door open"
    id: door_open
    device_class: door
    lambda: |-
      float closed = id(door_closed_distance).state;
      if (std::isnan(closed) || closed <= 0 || !id(door_distance).has_state()) return {};
      float distance = id(door_distance).state;
      return std::isnan(distance) || distance > closed + ${door_margin};
    filters:
      - delayed_on: 2s
      - delayed_off: 1s

  - platform: template
    name: "Local temperature alarm"
    id: local_alarm
    lambda: |-
      float threshold = id(alarm_threshold).state;
      if (!id(air_temperature).has_state() || std::isnan(threshold)) return {};
      return id(air_temperature).state > threshold;
    filters:
      - delayed_on: 10min
      - delayed_off: 1min

substitutions:
  device_name: austral-device
  alarm_threshold: "-12.0"
  # Meters above the closed-door baseline before the door counts as open.
  door_margin: "0.05"
  ingest_url: !secret ingest_url
  ingest_token: !secret ingest_token

esphome:
  name: ${device_name}
  friendly_name: Austral Device
  includes:
    - ingest.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          for (auto *s : {(PollingComponent *) id(product_temperature), (PollingComponent *) id(air_temperature), (PollingComponent *) id(ambient_temperature)}) {
            s->stop_poller();
            s->set_update_interval((uint32_t) id(read_interval).state * 1000);
            s->start_poller();
          }
          austral::boot = esphome::random_uint32();

esp32:
  board: esp32dev

logger:
  level: INFO
  logs:
    # A missing echo is expected and published as nan. Do not log it ten times a second.
    ultrasonic.sensor: ERROR

wifi:
  id: wifi_client
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Lower peak transmit current for boards with a weak 3.3 V regulator.
  output_power: 8.5dB
  ap:
    ssid: "Austral-Device-Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

# Readings leave in batches through POST /ingest (schema/api.md). An https URL is checked against the
# public CA bundle, so the Cloudflare certificate needs nothing on the device.
http_request:
  timeout: 10s

interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: send_batch

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: "gfonts://Roboto"
    id: display_font
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      auto t = [](sensor::Sensor *s) { return s->has_state() ? str_sprintf("%.1f", s->state) : std::string("--"); };
      it.printf(0, 0,  id(display_font), "Prod %s Air %s", t(id(product_temperature)).c_str(), t(id(air_temperature)).c_str());
      it.printf(0, 11, id(display_font), "Amb %s  %s", t(id(ambient_temperature)).c_str(), id(local_alarm).state ? "ALARM!" : "alarm ok");
      it.printf(0, 22, id(display_font), "WiFi %s  Net %s", id(wifi_client).is_connected() ? "ok" : "--", austral::last_post_ok ? "ok" : "--");

one_wire:
  - platform: gpio
    pin: GPIO4
    id: one_wire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: one_wire_bus
    address: !secret product_sensor_address
    name: "Product temperature"
    id: product_temperature
    resolution: 12
    update_interval: 10s
    on_value:
      - lambda: 'austral::push("sensor/product_temperature", austral::number(x, 1));'

  - platform: dallas_temp
    one_wire_id: one_wire_bus
    address: !secret air_sensor_address
    name: "Air temperature"
    id: air_temperature
    resolution: 12
    update_interval: 10s
    on_value:
      - lambda: 'austral::push("sensor/air_temperature", austral::number(x, 1));'

  - platform: dallas_temp
    one_wire_id: one_wire_bus
    address: !secret ambient_sensor_address
    name: "Ambient temperature"
    id: ambient_temperature
    resolution: 12
    update_interval: 10s
    on_value:
      - lambda: 'austral::push("sensor/ambient_temperature", austral::number(x, 1));'

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    on_value:
      - lambda: 'if (!std::isnan(x)) austral::push("sensor/wifi_signal", austral::number(x, 0));'

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    on_value:
      - lambda: 'austral::push("sensor/uptime", austral::number(x, 0));'

  - platform: template
    name: "Ingest last status"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return austral::last_status;'

  - platform: template
    name: "Ingest queued"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return austral::queued.size() + austral::in_flight.size();'

  # HC-SR04: Trig on GPIO26, Echo on GPIO27 through a 1k/2k divider.
  # Raw reads every 100 ms feed the calibration. Published once a second as the median of those 10 reads.
  - platform: ultrasonic
    trigger_pin: GPIO26
    echo_pin: GPIO27
    name: "Door distance"
    id: door_distance
    update_interval: 100ms
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 10
          send_every: 10
    on_value:
      - lambda: 'austral::push("sensor/door_distance", austral::number(x, 3));'
    on_raw_value:
      - lambda: |-
          if (id(calibrating) && !std::isnan(x) && x > 0) id(calibration_samples).push_back(x);

globals:
  - id: calibrating
    type: bool
    initial_value: "false"
  - id: calibration_samples
    type: std::vector<float>

script:
  - id: send_batch
    mode: single
    then:
      - lambda: 'austral::take();'
      - http_request.post:
          url: ${ingest_url}
          request_headers:
            Authorization: "Bearer ${ingest_token}"
            Content-Type: application/json
          body: !lambda 'return austral::body("${device_name}");'
          on_response:
            then:
              - lambda: |-
                  if (response->status_code >= 300) ESP_LOGW("ingest", "Batch %u answered %d", (unsigned) austral::seq, response->status_code);
                  austral::answered(response->status_code);
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("ingest", "Batch %u got no answer, resending", (unsigned) austral::seq);
                  austral::last_post_ok = false;
                  austral::last_status = -1;

  - id: calibrate_door
    mode: single
    then:
      - lambda: |-
          id(calibration_samples).clear();
          id(calibrating) = true;
      - delay: 3s
      - lambda: |-
          id(calibrating) = false;
          auto &v = id(calibration_samples);
          if (v.size() < 5) {
            ESP_LOGW("calibrate", "Door calibration failed: %u valid samples, need 5. Baseline unchanged.", (unsigned) v.size());
            return;
          }
          std::sort(v.begin(), v.end());
          float median = v.size() % 2 ? v[v.size() / 2] : (v[v.size() / 2 - 1] + v[v.size() / 2]) / 2;
          ESP_LOGI("calibrate", "Door closed distance %.3f m from %u samples", median, (unsigned) v.size());
          id(door_closed_distance).make_call().set_value(median).perform();
          v.clear();

button:
  - platform: template
    name: "Calibrate door"
    id: calibrate_door_button
    on_press:
      - script.execute: calibrate_door

output:
  - platform: gpio
    pin: GPIO25
    id: buzzer_output

switch:
  - platform: output
    output: buzzer_output
    name: "Buzzer"
    id: buzzer
    on_turn_on:
      - lambda: 'austral::push("switch/buzzer", "ON");'
    on_turn_off:
      - lambda: 'austral::push("switch/buzzer", "OFF");'

number:
  - platform: template
    name: "Read interval"
    id: read_interval
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 10
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          for (auto *s : {(PollingComponent *) id(product_temperature), (PollingComponent *) id(air_temperature), (PollingComponent *) id(ambient_temperature)}) {
            s->stop_poller();
            s->set_update_interval((uint32_t) x * 1000);
            s->start_poller();
          }
    on_value:
      - lambda: 'austral::push("number/read_interval", austral::number(x, 1));'

  - platform: template
    name: "Door closed distance"
    id: door_closed_distance
    unit_of_measurement: m
    min_value: 0
    max_value: 4
    step: 0.001
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true
    on_value:
      - lambda: 'austral::push("number/door_closed_distance", austral::number(x, 3));'

binary_sensor:
  - platform: template
    name: "Door open"
    id: door_open
    device_class: door
    lambda: |-
      float closed = id(door_closed_distance).state;
      if (std::isnan(closed) || closed <= 0 || !id(door_distance).has_state()) return {};
      float d = id(door_distance).state;
      return std::isnan(d) || d > closed + ${door_margin};
    filters:
      - delayed_on: 2s
      - delayed_off: 1s
    on_state:
      - lambda: 'austral::push("binary_sensor/door_open", austral::on_off(x));'

  - platform: template
    name: "Local temperature alarm"
    id: local_alarm
    lambda: |-
      return id(product_temperature).has_state() && id(product_temperature).state > ${alarm_threshold};
    filters:
      - delayed_on: 10min
      - delayed_off: 1min
    on_state:
      - lambda: 'austral::push("binary_sensor/local_temperature_alarm", austral::on_off(x));'
    on_press:
      - switch.turn_on: buzzer
    on_release:
      - switch.turn_off: buzzer
